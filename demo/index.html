<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codeglint demo</title>
    <link rel="stylesheet" href="../src/themes/base.css" />
    <link rel="stylesheet" href="../src/themes/light.css" />
    <link rel="stylesheet" href="../src/themes/dark.css" disabled />
    <style>
      :root {
        color-scheme: light;
      }
      html[data-theme="dark"] {
        color-scheme: dark;
      }
      body {
        margin: 2rem;
        font-family: system-ui, sans-serif;
        background: #f3f4f6;
        color: #111827;
      }
      html[data-theme="dark"] body {
        background: #111827;
        color: #e5e7eb;
      }
      .demo-pane {
        margin-bottom: 2rem;
      }
      pre {
        padding: 1rem;
        border-radius: 0.75rem;
        overflow: auto;
        background: #fff;
        border: 1px solid #e5e7eb;
      }
      html[data-theme="dark"] pre {
        background: #0f172a;
        border-color: #334155;
      }
      .toolbar {
        margin-bottom: 1rem;
      }
      button {
        padding: 0.6rem 0.9rem;
        border-radius: 0.5rem;
        border: 1px solid #cbd5e1;
        cursor: pointer;
      }
      h2 {
        margin: 0 0 0.75rem;
      }
      .note {
        margin: 0 0 0.75rem;
        color: #475569;
      }
      html[data-theme="dark"] .note {
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <button id="theme-toggle" type="button">Switch to dark</button>
    </div>

    <div class="demo-pane">
      <h2>JSON</h2>
      <pre><code id="json-demo" class="codeglint"></code></pre>
    </div>

    <div class="demo-pane">
      <h2>JavaScript</h2>
      <pre><code id="js-demo" class="codeglint"></code></pre>
    </div>

    <div class="demo-pane">
      <h2>Malformed JSON</h2>
      <p class="note">The lexer keeps malformed content visible while preserving the source.</p>
      <pre><code id="broken-demo" class="codeglint"></code></pre>
    </div>

    <div class="demo-pane">
      <h2>HTML-special content</h2>
      <p class="note">Strings such as &lt;script&gt; and &amp; are escaped safely.</p>
      <pre><code id="escaped-demo" class="codeglint"></code></pre>
    </div>

    <script src="./codeglint-standalone.js"></script>
    <script src="./demo.js"></script>
  </body>
</html>
